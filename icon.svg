<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a0a12"/>
      <stop offset="1" stop-color="#10131c"/>
    </linearGradient>
    <clipPath id="tile"><rect width="256" height="256" rx="40"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- mundo normal -->
    <rect width="256" height="128" fill="#1b2233"/>
    <!-- mundo del revés -->
    <rect y="128" width="256" height="128" fill="url(#under)"/>

    <!-- curvas de nivel en el revés -->
    <g fill="none" stroke="#7a1422" stroke-width="2" opacity="0.8">
      <path d="M-10,160 C50,150 90,172 128,164 C170,155 210,172 266,160"/>
      <path d="M-10,190 C40,178 100,204 140,192 C180,180 220,198 266,188"/>
      <path d="M-10,222 C60,210 110,236 150,224 C190,212 230,230 266,220"/>
    </g>

    <!-- gatito normal -->
    <g fill="#c9d1e0">
      <path d="M104,128 C104,100 112,88 128,88 C144,88 152,100 152,128 Z"/>
      <circle cx="128" cy="72" r="22"/>
      <path d="M109,62 L106,38 L124,52 Z"/>
      <path d="M147,62 L150,38 L132,52 Z"/>
    </g>
    <path d="M150,124 C172,122 178,102 166,94" fill="none" stroke="#c9d1e0" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="120" cy="72" rx="2.5" ry="5" fill="#1b2233"/>
    <ellipse cx="136" cy="72" rx="2.5" ry="5" fill="#1b2233"/>

    <!-- reflejo invertido -->
    <g transform="translate(0,256) scale(1,-1)" filter="url(#glow)">
      <g fill="#e0192f">
        <path d="M104,128 C104,100 112,88 128,88 C144,88 152,100 152,128 Z"/>
        <circle cx="128" cy="72" r="22"/>
        <path d="M109,62 L106,38 L124,52 Z"/>
        <path d="M147,62 L150,38 L132,52 Z"/>
      </g>
      <path d="M150,124 C172,122 178,102 166,94" fill="none" stroke="#e0192f" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="120" cy="72" rx="2.5" ry="5" fill="#fff4d6"/>
      <ellipse cx="136" cy="72" rx="2.5" ry="5" fill="#fff4d6"/>
    </g>

    <!-- línea de corte entre mundos -->
    <rect y="126" width="256" height="4" fill="#ff3b4f" filter="url(#glow)"/>

    <!-- esporas flotando -->
    <g fill="#d9c8c8" opacity="0.7">
      <circle cx="40" cy="150" r="2"/>
      <circle cx="210" cy="146" r="1.5"/>
      <circle cx="70" cy="205" r="1.5"/>
      <circle cx="196" cy="214" r="2"/>
      <circle cx="226" cy="178" r="1.2"/>
      <circle cx="30" cy="236" r="1.2"/>
    </g>
  </g>
</svg>
